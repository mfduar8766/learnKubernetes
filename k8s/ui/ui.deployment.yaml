apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-deployment
  labels: # USED AS IDENTIFIERS FOR THAT COMPONENT. MULTIPLE REPLICAS GET UNIQUE NAME BUT SHARE SAME LABEL
    # THIS IS A KEY VALUE PAIR SO IT CAN BE ANYTHING LIKE application: ui ETC
    # THIS IS USED BY THE SERVICE FOR MATCHING SERVICE TO DEPLOYMENT
    app: ui
spec: # DEPLOYMENT SPEFICICATIONS
  replicas: 1
  selector: # ALLOWS K8S TO DETERMINE WHICH OD BELONGS TO WHICH DEPLOYMENT
    matchLabels: # TELL DEPLOYMENT TO CONNECT/MATCH ALL LABELS BY THE SELECTOR
      app: ui
  template: # BLUE PRINT FOR THE PODS. CONFIG OF THE POD WITHIN CONFIG OF DEPLOYMENT. CONFIGURES THE POD
    metadata:
      labels:
        app: ui
    spec: # POD SPECIFICATIONS
      containers:
        - name: ui
          image: my-ui-app:v1
          # Always: Pulls from dockerHub and if the image exists locally but its a new version on DH it pulls from DH
          # IfNotPresent: Only pulls image if it DOES NOT EXIST on the node
          imagePullPolicy: Never # Tell K8s to look locally instead of trying to download it
          ports:
            - containerPort: 3000
          envFrom: # THIS WILL TAKE THE VALUES FROM THESE FILES UNDER THE DATA: FIELD SO NAMES MUST MATCH EXACTLY
            - configMapRef:
                name: mongo-config
            - secretRef:
                name: mongo-secret
            - secretRef:
                name: redis-secret
            - configMapRef:
                name: redis-config
          # env:
          #   - name: MONGO_INITDB_ROOT_USERNAME
          #     valueFrom:
          #       secretKeyRef:
          #         name: mongo-secret
          #         key: mongo-user
          #   - name: MONGO_INITDB_ROOT_PASSWORD
          #     valueFrom:
          #       secretKeyRef:
          #         name: mongo-secret
          #         key: mongo-password
          #   - name: REDIS_PASSWORD
          #     valueFrom:
          #       secretKeyRef:
          #         name: redis-secret
          #         key: redis-password
          #   - name: DB_URL
          #     valueFrom:
          #       configMapKeyRef:
          #         name: mongo-config
          #         key: mongo-url

          # 1. Is the app alive? (If no, restart it)
          # httpGet: Hits an endpoint. A response code between 200–399 is a "success." (STANDARD)
          # exec: Runs a command inside the container (e.g., cat /tmp/healthy). If the command returns exit code 0, it's a "success."
          # tcpSocket: Checks if a specific port is open. If the TCP connection is successful, it's a "success." (2ND CHOICE)
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15 # How long to wait after the container starts before checking
            periodSeconds: 10 # How often to perform the check
            failureThreshold: 3 # How many times to fail before K8s gives up and takes action (restarting or removing from service
            # 2. Is the app ready for traffic? (If no, stop sending users here)
            successThreshold: 1

          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 25
            periodSeconds: 10 # Check every 5 seconds
            failureThreshold: 3 # Must fail 3 times (3*5) to be removed
            successThreshold: 1 # Only needs 1 success to be put back in rotation
---
# # SERVICE: THIS CAN BE A SEPERATE FILE LIKE ui.service.yaml BUT CONVENTION IS TO KEEP IT IN DEPLOYMENT.YAML

# EXAMPLE OF INTERNAL SERVICE USING INGRESS TO EXPOSE IT OUTSIDE CLUSTER
apiVersion: v1
kind: Service
metadata:
  name: ui-service
spec:
  type: ClusterIP
  selector:
    app: ui
  ports:
    - protocol: TCP
      port: 3000 # 2. OPTIONAL: Change to 80 so you don't have to type :3000 in the browser. ONLLY IF USING LoadBalancer
      targetPort: 3000 # 3. KEEP THIS: This must still match your containerPort

# EXAMPLE OF EXTERNAL SERVICE NO INGRESS USING NodePort

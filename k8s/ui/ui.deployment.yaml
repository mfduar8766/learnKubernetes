#   # NodePort: Opens up a PORT on every single Node(Server) in the cluster
#   # LoadBalancer - Same as NOdePort but used for cloud providers (GCP/AWSAzure)
#   type: NodePort # DEFAULT TYPE IS ClusterIP WHICH MEANS ITS INTERNAL. NodePort MAKES IT EXTERNAL

# --- Persistence ---
# Save messages to disk so they survive a container restart
persistence true
persistence_location /mosquitto/data/

# --- Logging ---
# Log to the console so you can see it in 'kubectl logs'
log_timestamp_format %Y-%m-%dT%H:%M:%S
log_dest stdout
log_type all

# --- Default Listener ---
# Listen on all interfaces (Kubernetes Service needs this)
listener 1883 0.0.0.0
protocol mqtt

# --- Security ---
# Block anyone who doesn't have a login
allow_anonymous false

# Tell Mosquitto where the 'mosquitto-secret' volume is mounted
# password_file /mosquitto/config/password_file
password_file /mosquitto/auth/password_file

## --- MQTT v5 Features ---
# Support for Topic Aliasing
max_topic_alias 10

# max_keepalive 60

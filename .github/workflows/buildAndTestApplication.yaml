name: Build and Test Application
on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      ["master", "feature/*", "bugfix/*", "release/*", "!poc/*", "!test/*"]
jobs:
  set_up_and_test:
    name: Set Up Go Install Dependencies and Run Unit Tests
    runs-on: ubuntu-latest
    # defaults:
    #   run:
    #     working-directory: ./scripts
    steps:
      - name: Check out the repository to the runner
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.work"
          cache-dependency-path: "**/*.sum" # Caches all sub-module dependencies
      - name: Install Dependencies
        working-directory: ./scripts
        run: |
          chmod +x ./setUp.sh
          ./setUp.sh
      - name: Run Unit Tests
        working-directory: ./scripts
        run: |
          chmod +x ./runTests.sh
          ./runTests.sh
  build_and_publish_docker_images:
    name: Build and Publish Docker Images For All Services
    runs-on: ubuntu-latest
    needs: set_up_and_test
    strategy:
      matrix:
        include:
          - service: "app-gateway"
            image_name: "app-gateway"
            dockerfile: "app-gateway/Dockerfile"
            version_file: "app-gateway/version.txt"
            pass_tailwind: true
    steps:
      - name: Check out the repository to the runner
        uses: actions/checkout@v6
      - name: Read Service apiVersion
        id: get_version
        run: |
          VERSION=$(cat ${{ matrix.version_file }})
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Generate Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: mfduar8766/${{ matrix.image_name }}
          tags: |
            type=raw,value=version_${{ steps.get_version.outputs.version }}_commit_{{sha}}_timestamp_{{date 'YYYY_MM_DD_time_HH_mm_ss'}}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            ${{ matrix.pass_tailwind && 'TAIL_WIND_VRSION=4.2.2' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

